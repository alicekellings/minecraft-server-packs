# ============================================================
#  SkyBlock Setup — bukkit.yml
#  Tuned for an island-style load: MANY small worlds with
#  frequent chunk loading (very different from a single world).
#
#  The single most important fact for an island server:
#  spawn-limits are PER WORLD. With one world per island, the
#  defaults (monsters 70, animals 10) multiply by the number of
#  islands — 100 islands would allow 7,000 monsters. The values
#  below are cut for a many-worlds server.
# ============================================================

settings:
  # Vanilla End is unused: island worlds are created by BentoBox.
  allow-end: false
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
  shutdown-message: Server restarting. Back in a minute.
  minimum-api: none
  use-map-color-cache: true

# Per-world caps — deliberately low because they multiply by island count.
spawn-limits:
  monsters: 8
  animals: 5
  water-animals: 2
  water-ambient: 1
  ambient: 1
  water-underground-creature: 2
  axolotls: 2

chunk-gc:
  # Many small worlds churn chunks; collect sooner than the default 600.
  period-in-ticks: 300

ticks-per:
  # Spawn attempts less often — the same result per island, far less CPU.
  animal-spawns: 800
  monster-spawns: 40
  water-spawns: 800
  water-ambient-spawns: 800
  ambient-spawns: 800
  water-underground-creature-spawns: 20
  axolotl-spawns: 20
  # Autosave less often: with many worlds the default 6000 is a lot of I/O.
  autosave: 12000

aliases: now-in-commands.yml
